<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="utf-8" />
    <title>Trage Wegen Monitor - Maarkedal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        #map { 
            height: 100vh; 
            width: 100vw; 
            background: #e0e0e0; /* Grijze achtergrond terwijl kaart laadt */
        }
        .legend {
            position: absolute;
            bottom: 20px;
            left: 10px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            font-size: 12px;
            line-height: 18px;
            pointer-events: none; /* Klikken gaat door legende heen naar kaart */
        }
        .legend i {
            width: 18px;
            height: 12px;
            float: left;
            margin-right: 8px;
            opacity: 0.7;
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="legend">
        <strong>Legende</strong><br>
        <i style="background: #3388ff"></i> Buurtwegen (Atlas)<br>
        <i style="background: #33cc33"></i> Wijzigingen<br>
        <i style="background: red"></i> Match (Omgevingsloket)<br>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 1. Initialiseer de kaart
        // We zetten 'tap' op false voor betere compatibiliteit met mobiele browsers
        var map = L.map('map', {
            center: [50.78, 3.63], 
            zoom: 13,
            tap: false 
        });

        // 2. Basislaag (OpenStreetMap)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // 3. Functie om GeoJSON veilig in te laden
        function loadGeoJSON(fileName, layerStyle, isMatchLayer = false) {
            fetch(fileName)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Bestand ' + fileName + ' niet gevonden (Status: ' + response.status + ')');
                    }
                    return response.json();
                })
                .then(data => {
                    const geoLayer = L.geoJSON(data, {
                        style: layerStyle,
                        onEachFeature: function (feature, layer) {
                            if (isMatchLayer) {
                                // Dossier informatie voor de popup
                                const d_id = feature.properties.dossierid || feature.properties.dossier_id || "Onbekend";
                                const link = feature.properties.Link || "#";
                                
                                layer.bindPopup(`
                                    <strong>MATCH GEVONDEN</strong><br>
                                    Dossier: ${d_id}<br>
                                    <hr>
                                    <a href="${link}" target="_blank" style="color: red; font-weight: bold;">Open Omgevingsloket</a>
                                `);

                                // Check of dit dossier in de URL staat om op in te zoomen
                                const urlParams = new URLSearchParams(window.location.search);
                                if (urlParams.get('dossier') === d_id) {
                                    setTimeout(() => {
                                        map.fitBounds(layer.getBounds(), { padding: [50, 50], maxZoom: 17 });
                                        layer.openPopup();
                                    }, 1000);
                                }
                            }
                        }
                    }).addTo(map);
                    console.log("Succesvol geladen: " + fileName);
                })
                .catch(err => {
                    console.warn("Kon laag niet laden: " + err.message);
                });
        }

        // 4. Start het laden van de verschillende bestanden
        // Zorg dat deze bestanden in dezelfde map op GitHub staan
        loadGeoJSON('buurtwegenoostvlaanderen.geojson', {
            color: "#3388ff",
            weight: 3,
            opacity: 0.6
        });

        loadGeoJSON('wijzigingenoostvlaanderen.geojson', {
            color: "#33cc33",
            weight: 3,
            opacity: 0.6
        });

        loadGeoJSON('matches.geojson', {
            color: "red",
            fillColor: "red",
            fillOpacity: 0.4,
            weight: 2
        }, true); // 'true' geeft aan dat dit de match-laag is met popups en zoom-focus

    </script>
</body>
</html>
