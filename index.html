<!DOCTYPE html>
<html>
<head>
    <title>Trage Wegen Monitor</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; padding: 0; }
        #map { height: 100vh; width: 100vw; }
        .legend { background: white; padding: 10px; line-height: 18px; border-radius: 5px; box-shadow: 0 0 15px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        var map = L.map('map').setView([50.8, 3.6], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);

        const urlParams = new URLSearchParams(window.location.search);
        const targetDossier = urlParams.get('dossier');

        // 1. Statische Wegen
        fetch('https://raw.githubusercontent.com/carameljm/buurtwegenomgevingsdossiers/main/buurtwegenoostvlaanderen.geojson')
            .then(r => r.json())
            .then(data => L.geoJSON(data, { style: { color: "#3388ff", weight: 2, opacity: 0.7 } }).addTo(map));

        // 2. Matches laden en focussen
        fetch('matches.geojson')
            .then(r => r.json())
            .then(data => {
                const matchLayer = L.geoJSON(data, {
                    style: { color: "red", fillColor: "red", fillOpacity: 0.4 },
                    onEachFeature: (feature, layer) => {
                        const id = feature.properties.dossierid || feature.properties.dossier_id;
                        layer.bindPopup(`<b>Dossier:</b> ${id}<br><a href="${feature.properties.Link}" target="_blank">Open Loket</a>`);
                        
                        // Automatische zoom als parameter matcht
                        if (targetDossier && id === targetDossier) {
                            setTimeout(() => {
                                map.fitBounds(layer.getBounds(), { padding: [50, 50], maxZoom: 17 });
                                layer.openPopup();
                            }, 500);
                        }
                    }
                }).addTo(map);
            });
    </script>
</body>
</html>
