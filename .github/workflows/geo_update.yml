name: GeoData Processor

on:
  schedule:
    - cron: '0 * * * *'  # Draait elk uur
  workflow_dispatch:      # Hiermee kun je het handmatig starten

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libproj-dev gdal-bin libgeos-dev libspatialindex-dev

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip' # Versnelt toekomstige runs

      - name: Install Python Packages
        run: |
          pip install pandas geopandas shapely pyproj rtree requests

      - name: Run Geo Script
        env:
          HA_URL: ${{ secrets.HA_URL }}
          HA_TOKEN: ${{ secrets.HA_TOKEN }}
        run: python mijn_geo_script.py
