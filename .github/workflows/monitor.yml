name: Trage Wegen Monitor

on:
schedule:
# Dit draait elke maandag om 00:00 UTC.
# Uitleg cron: 'minuut uur dag-v-maand maand dag-v-week'
- cron: '0 0 * * 1'
workflow_dispatch: # Hiermee kun je het script handmatig starten via de GitHub UI

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    # Deze stap kopieert je bestanden naar de virtuele computer van GitHub
    uses: actions/checkout@v3

  - name: Set up Python
    # Hier wordt Python geïnstalleerd
    uses: actions/setup-python@v4
    with:
      python-version: '3.9'

  - name: Install dependencies
    # Installatie van bibliotheken zoals Geopandas en OpenPyXL
    run: |
      python -m pip install --upgrade pip
      pip install geopandas pandas requests openpyxl fiona pyproj rtree shapely

  - name: Run Monitor Script
    # Voer het Python script uit
    run: python trage_wegen_monitor.py

  - name: Upload Rapport
    # Bewaar het Excel-resultaat als downloadbaar bestand (Artifact)
    uses: actions/upload-artifact@v3
    with:
      name: trage-wegen-rapporten
      path: rapporten/*.xlsx

